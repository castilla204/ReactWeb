<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Deshabilitar caché en desarrollo -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Security Meta Tags -->
    <!-- ✅ X-Frame-Options se configura en headers HTTP (nginx.conf y vite.config.ts), no funciona como meta tag -->
    <!-- ✅ Content-Security-Policy SÍ funciona como meta tag y se agrega como respaldo adicional -->
    <!-- ⚠️ frame-ancestors NO funciona en meta tags, solo en headers HTTP (ya configurado en vite.config.ts y nginx.conf) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.googleapis.com https://js.stripe.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:7124 ws://localhost:7124 https://newapi-yn9v.onrender.com https://api.atrapo.io https://ipapi.co https://accounts.google.com https://api.stripe.com https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com https://*.basemaps.cartocdn.com https://*.cartocdn.com wss://cckrnifvbrwuagzlsrbj.supabase.co https://cckrnifvbrwuagzlsrbj.supabase.co; frame-src 'self' https://accounts.google.com https://js.stripe.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(), camera=()" />
    
    <!-- SEO Meta Tags -->
    <title>inspecciono.com - Plataforma de Contratación de Servicios de Verificación Profesional</title>
    <meta name="description" content="Contrata servicios profesionales de verificación e inspección. Conecta con expertos verificados para revisar vehículos, inmuebles y más. Proceso seguro y garantizado." />
    <meta name="keywords" content="contratación servicios, verificación profesional, inspección vehículos, inspección inmuebles, expertos verificados, servicios profesionales" />
    <meta name="author" content="inspecciono.com" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Spanish" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inspecciono.com/" />
    <meta property="og:title" content="inspecciono.com - Contratación de Servicios de Verificación Profesional" />
    <meta property="og:description" content="Contrata servicios profesionales de verificación e inspección. Conecta con expertos verificados para revisar vehículos, inmuebles y más." />
    <meta property="og:image" content="https://inspecciono.com/og-image.jpg" />
    <meta property="og:site_name" content="inspecciono.com" />
    <meta property="og:locale" content="es_ES" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://inspecciono.com/" />
    <meta property="twitter:title" content="inspecciono.com - Contratación de Servicios de Verificación Profesional" />
    <meta property="twitter:description" content="Contrata servicios profesionales de verificación e inspección. Conecta con expertos verificados." />
    <meta property="twitter:image" content="https://inspecciono.com/twitter-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://inspecciono.com/" />
    
    <link rel="icon" type="image/png" href="/src/media/logoi.png" />
    
    <!-- ✅ OPTIMIZACIONES PARA WEBVIEW: Preconnect a recursos externos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    
    <!-- ✅ DNS Prefetch para APIs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ✅ Optimizaciones para webview: reducir layout shifts -->
    <style>
      /* Critical CSS inline para evitar FOUC */
      body { margin: 0; padding: 0; }
      #root { min-height: 100vh; }
      /* Optimizar rendering */
      * { box-sizing: border-box; }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
