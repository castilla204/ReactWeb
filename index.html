<!doctype html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Security Meta Tags -->
    <!-- ✅ X-Frame-Options se configura en headers HTTP (nginx.conf y vite.config.ts), no funciona como meta tag -->
    <!-- ✅ Content-Security-Policy SÍ funciona como meta tag y se agrega como respaldo adicional -->
    <!-- ⚠️ frame-ancestors NO funciona en meta tags, solo en headers HTTP (ya configurado en vite.config.ts y nginx.conf) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.googleapis.com https://js.stripe.com https://api.mapbox.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:7124 ws://localhost:7124 https://newapi-yn9v.onrender.com https://api.atrapo.io https://ipapi.co https://accounts.google.com https://api.stripe.com https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com https://*.basemaps.cartocdn.com https://*.cartocdn.com https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com wss://cckrnifvbrwuagzlsrbj.supabase.co https://cckrnifvbrwuagzlsrbj.supabase.co; frame-src 'self' https://accounts.google.com https://js.stripe.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(), camera=()" />

    <!-- ═══════════════════════════════════════════════════════════════════════════
         SEO — Tarjeta de SERP (lo que se ve en Google ANTES de hacer clic)
         ═══════════════════════════════════════════════════════════════════════════ -->
    <title>Antes de comprar, inspecciona · Peritos verificados | Inspecciono</title>
    <meta name="description" content="¿Vas a comprar un coche, un piso o una moto de segunda mano? Un experto verificado lo revisa por ti y te entrega un informe. Pago seguro en escrow." />
    <meta name="author" content="Inspecciono" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#0066cc" />

    <!-- Canonical: SOLO la home queda hardcoded a /. Para subrutas, App.tsx inyecta
         el canonical correcto en runtime (React 19 hoistea <link> al <head>).
         OJO: no añadir "<link rel='canonical' href='/foo'>" estático aquí — perjudica indexación. -->
    <link rel="canonical" href="https://inspecciono.com/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inspecciono.com/" />
    <meta property="og:site_name" content="Inspecciono" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Antes de comprar, que un experto lo revise por ti" />
    <meta property="og:description" content="Coches, pisos, motos. Un perito verificado va, lo inspecciona y te entrega un informe. Tú no pagas hasta dar el visto bueno." />
    <meta property="og:image" content="https://inspecciono.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Inspecciono — inspecciones y peritajes pre-compra con expertos verificados en España" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://inspecciono.com/" />
    <meta name="twitter:title" content="Antes de comprar, que un experto lo revise por ti" />
    <meta name="twitter:description" content="Coches, pisos, motos. Un perito verificado lo inspecciona y te entrega un informe. Pago retenido hasta tu visto bueno." />
    <meta name="twitter:image" content="https://inspecciono.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Inspecciono — inspecciones y peritajes pre-compra" />

    <!-- ═══════════════════════════════════════════════════════════════════════════
         JSON-LD Structured Data (rich snippets en Google)
         ═══════════════════════════════════════════════════════════════════════════ -->

    <!-- Organization: identifica la marca a Google. Logo + dominio + contacto. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Inspecciono",
      "legalName": "Inspecciono",
      "url": "https://inspecciono.com",
      "logo": "https://inspecciono.com/favicon.png",
      "description": "Marketplace español de servicios de inspección y peritaje pre-compra: coches, inmuebles, motos, maquinaria y más, realizados por expertos verificados con pago en escrow.",
      "areaServed": { "@type": "Country", "name": "España" },
      "contactPoint": [{
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "soporte@inspecciono.com",
        "availableLanguage": ["Spanish"],
        "areaServed": "ES"
      }]
    }
    </script>

    <!-- WebSite: name + url. (Sin SearchAction porque /buscar?q= aún no existe. Añadirlo cuando exista.) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Inspecciono",
      "url": "https://inspecciono.com",
      "inLanguage": "es-ES"
    }
    </script>

    <!-- Service + OfferCatalog: describe el catálogo de inspecciones a Google. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Inspección y peritaje pre-compra",
      "provider": {
        "@type": "Organization",
        "name": "Inspecciono",
        "url": "https://inspecciono.com"
      },
      "areaServed": { "@type": "Country", "name": "España" },
      "audience": {
        "@type": "Audience",
        "audienceType": "Compradores de productos de segunda mano"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Categorías de inspección",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Inspección de coche de segunda mano" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Peritaje de piso antes de comprar" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Inspección de moto de segunda mano" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Peritaje de maquinaria de segunda mano" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Inspección de bici eléctrica de segunda mano" } }
        ]
      }
    }
    </script>

    <!-- FAQPage JSON-LD: ahora se inyecta dinámicamente desde HomePage.tsx (5 preguntas) y
         FAQPage.tsx (las 41) vía componente <SEO>, no aquí. Antes este bloque emitía las
         mismas 5 preguntas en TODAS las rutas — error: Google penaliza JSON-LD que no
         coincide con el contenido visible de la página. -->

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ✅ OPTIMIZACIONES PARA WEBVIEW: Preconnect a recursos externos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" />

    <!-- ✅ API Backend: preconnect ahorra DNS+TCP+TLS (~150-280 ms) en el primer fetch del mapa -->
    <link rel="preconnect" href="https://newapi-yn9v.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://newapi-yn9v.onrender.com" />
    <link rel="preconnect" href="https://api.atrapo.io" crossorigin />
    <link rel="dns-prefetch" href="https://api.atrapo.io" />

    <!-- ✅ CartoCDN: los tiles del mapa usan a/b/c/d.basemaps.cartocdn.com (sharding HTTP/1).
         Pre-resolver los 4 subdominios ahorra ~200-500 ms en el primer pintado del mapa.
         (El MapContainer ahora usa un solo host para HTTP/2, pero mantenemos los 4 por compatibilidad). -->
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://d.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />

    <link rel="prefetch" href="/geo/ne_110m_land.geojson" as="fetch" crossorigin />

    <!-- ✅ DNS Prefetch para APIs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ✅ Optimizaciones para webview: reducir layout shifts -->
    <style>
      /* Critical CSS inline para evitar FOUC */
      body { margin: 0; padding: 0; }
      #root { min-height: 100vh; }
      /* Optimizar rendering */
      * { box-sizing: border-box; }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
