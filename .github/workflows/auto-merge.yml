name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for status checks
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Verificar que el PR es mergeable
            if (pr.mergeable === false) {
              core.setFailed('PR is not mergeable');
              return;
            }

            // Esperar a que todos los checks pasen
            const maxWait = 300; // 5 minutos máximo
            const checkInterval = 10; // Verificar cada 10 segundos
            let waited = 0;

            while (waited < maxWait) {
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              // Verificar que todos los checks pasaron
              const allPassed = 
                status.state === 'success' &&
                checks.check_runs.every(check => 
                  check.status === 'completed' && 
                  (check.conclusion === 'success' || check.conclusion === 'skipped')
                );

              if (allPassed) {
                console.log('✅ All checks passed');
                break;
              }

              console.log(`⏳ Waiting for checks... (${waited}s/${maxWait}s)`);
              await new Promise(resolve => setTimeout(resolve, checkInterval * 1000));
              waited += checkInterval;
            }

            if (waited >= maxWait) {
              core.setFailed('Timeout waiting for checks');
              return;
            }

      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
            });
            console.log('✅ PR merged automatically');
