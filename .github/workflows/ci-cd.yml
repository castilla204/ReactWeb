name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "k8s/deployment.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "k8s/deployment.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: erizo9/reactweb

jobs:
  # Job de CI: Build, test y lint
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Regenerar package-lock.json si está desincronizado con package.json
          npm install --package-lock-only
          # Verificar que estén sincronizados
          npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests (if available)
        run: npm test --if-present || echo "No tests configured"

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Job de Security scanning (obligatorio - ANTES de build)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and update package-lock.json
        run: |
          # Regenerar package-lock.json para asegurar que esté sincronizado
          npm install --package-lock-only
          # Verificar que estén sincronizados
          npm ci

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'  # Formato legible para logs
          scanners: 'vuln'  # Solo escanear vulnerabilidades
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # FALLA EL WORKFLOW si hay vulnerabilidades críticas o altas

      - name: Run Trivy vulnerability scanner (SARIF format)
        id: trivy-sarif
        continue-on-error: true  # No fallar si Code Scanning no está habilitado
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          scanners: 'vuln'  # Solo escanear vulnerabilidades
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'
          exit-code: '0'  # No fallar aquí, ya se validó en el paso anterior

  # Job de CD: Build y push de imagen Docker
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci, security-scan]  # Solo se ejecuta si security-scan pasa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Update package-lock.json
        run: |
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: Update package-lock.json"
            git push
          else
            echo "No changes to package-lock.json"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
      - name: Get image digest
        id: image-digest
        run: |
          # Obtener el digest de la imagen latest
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          DIGEST=$(docker buildx imagetools inspect $IMAGE_TAG --format '{{json .}}' | jq -r '.manifest.digest')
          
          # Si no empieza con sha256:, agregarlo
          if [[ ! "$DIGEST" =~ ^sha256: ]]; then
            DIGEST="sha256:$DIGEST"
          fi
          
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

            - name: Pull latest changes before commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || git pull origin main --no-rebase || true
      
      - name: Update deployment.yaml
        if: github.ref == 'refs/heads/main'
        run: |
          # Verificar que el archivo existe
          if [ ! -f "k8s/deployment.yaml" ]; then
            echo "⚠️ k8s/deployment.yaml no existe en esta rama, saltando actualización"
            echo "Esto es normal en PRs o ramas que no tienen el archivo"
            exit 0
          fi
          
          DIGEST="${{ steps.image-digest.outputs.digest }}"
          echo "Updating deployment.yaml with digest: $DIGEST"
          echo "Current image line in deployment.yaml:"
          grep "image:" k8s/deployment.yaml || echo "No image line found"
          
          # Intentar múltiples formatos de imagen
          UPDATED=false
          
          # Formato 1: docker.io/erizo9/reactweb:latest@sha256:...
          if grep -q "image: docker.io/erizo9/reactweb:latest@sha256:" k8s/deployment.yaml; then
            sed -i "s|image: docker.io/erizo9/reactweb:latest@sha256:[a-f0-9]*|image: docker.io/erizo9/reactweb:latest@$DIGEST|g" k8s/deployment.yaml
            UPDATED=true
            echo "✅ Updated with format: docker.io/erizo9/reactweb:latest@sha256:..."
          # Formato 2: erizo9/reactweb:latest@sha256:...
          elif grep -q "image: erizo9/reactweb:latest@sha256:" k8s/deployment.yaml; then
            sed -i "s|image: erizo9/reactweb:latest@sha256:[a-f0-9]*|image: erizo9/reactweb:latest@$DIGEST|g" k8s/deployment.yaml
            UPDATED=true
            echo "✅ Updated with format: erizo9/reactweb:latest@sha256:..."
          # Formato 3: docker.io/erizo9/reactweb@sha256:...
          elif grep -q "image: docker.io/erizo9/reactweb@sha256:" k8s/deployment.yaml; then
            sed -i "s|image: docker.io/erizo9/reactweb@sha256:[a-f0-9]*|image: docker.io/erizo9/reactweb@$DIGEST|g" k8s/deployment.yaml
            UPDATED=true
            echo "✅ Updated with format: docker.io/erizo9/reactweb@sha256:..."
          # Formato 4: erizo9/reactweb@sha256:...
          elif grep -q "image: erizo9/reactweb@sha256:" k8s/deployment.yaml; then
            sed -i "s|image: erizo9/reactweb@sha256:[a-f0-9]*|image: erizo9/reactweb@$DIGEST|g" k8s/deployment.yaml
            UPDATED=true
            echo "✅ Updated with format: erizo9/reactweb@sha256:..."
          fi
          
          if [ "$UPDATED" = "false" ]; then
            echo "❌ No matching image pattern found in deployment.yaml"
            echo "Available image lines:"
            grep "image:" k8s/deployment.yaml || echo "No image line found"
            exit 1
          fi
          
          # Verificar que se actualizó correctamente
          if grep -q "$DIGEST" k8s/deployment.yaml; then
            echo "✅ deployment.yaml actualizado correctamente"
            echo "Updated line:"
            grep "image:" k8s/deployment.yaml | grep "$DIGEST"
          else
            echo "❌ Error: digest no encontrado en deployment.yaml después de actualizar"
            echo "Digest buscado: $DIGEST"
            echo "Contenido actual:"
            grep "image:" k8s/deployment.yaml || echo "No image line found"
            exit 1
          fi




      - name: Commit and push deployment update
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: Update deployment image digest [skip ci]'
          file_pattern: 'k8s/deployment.yaml'
          skip_dirty_check: true
          pull_options: '--rebase'  # Hacer pull con rebase antes de push

  notify:
    name: Notify - ArgoCD will deploy automatically
    runs-on: ubuntu-latest
    needs: [ci, security-scan, build-and-push]  # Solo se ejecuta si security-scan pasa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://inspecciono.com
