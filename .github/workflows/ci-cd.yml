            echo "Digest buscado: $DIGEST"
            echo "Contenido actual:"
            grep "image:" k8s/deployment.yaml || echo "No image line found"
            exit 1
          fi


      - name: Commit and push deployment update
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: Update deployment image digest [skip ci]'
          file_pattern: 'k8s/deployment.yaml'
