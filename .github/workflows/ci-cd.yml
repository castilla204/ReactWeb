name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "k8s/deployment.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "k8s/deployment.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Concurrency control - Best Practice 2025: Evita ejecuciones duplicadas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: erizo9/reactweb

jobs:
  # Job de CI: Build, test y lint
  ci:
    # NO ejecutar en PRs de renovate/dependabot para ahorrar costos
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'renovate[bot]' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
       !startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Regenerar package-lock.json si está desincronizado con package.json
          npm install --package-lock-only
          # Verificar que estén sincronizados
          npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests (if available)
        run: npm test --if-present || echo "No tests configured"

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Job de Security scanning (obligatorio - ANTES de build)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # NO ejecutar en PRs de renovate/dependabot para ahorrar costos
    if: |
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login != 'renovate[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/'))) &&
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    needs: ci

    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scanners: 'vuln,secret,config'
          ignore-unfixed: false
          cache-dir: /tmp/.cache/trivy

      - name: Run Trivy vulnerability scanner (SARIF format)
        id: trivy-sarif
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always() && steps.trivy-sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          wait-for-processing: false

  # Docker build and push
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci, security-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

  # Deployment to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ci, security-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    continue-on-error: true
    environment:
      name: production
      url: https://inspecciono.com

    steps:
      - name: Checkout k8s-configs
        uses: actions/checkout@v4
        with:
          repository: castilla204/k8s-configs
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          path: k8s-configs

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p ${VPS_SSH_PORT} -H ${VPS_HOST} >> ~/.ssh/known_hosts 2>&1 || echo "Warning: Could not add host to known_hosts, will use StrictHostKeyChecking=no"
          chmod 600 ~/.ssh/known_hosts || true

      - name: Check VPS connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '65002' }}
        run: |
          echo "Checking VPS connectivity on port ${VPS_SSH_PORT}..."
          if timeout 5 bash -c "echo > /dev/tcp/${VPS_HOST}/${VPS_SSH_PORT}" 2>/dev/null; then
            echo "✅ VPS is reachable on port ${VPS_SSH_PORT}"
          else
            echo "⚠️ VPS is not reachable on port ${VPS_SSH_PORT}, deployment will be skipped"
            exit 0
          fi

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '65002' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p ${VPS_SSH_PORT} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${VPS_USER}@${VPS_HOST} 'set -e
          echo "🚀 Starting deployment for react-web..."

          # Navigate to k8s-configs directory
          cd /root/k8s-configs || { echo "❌ Directory /root/k8s-configs not found"; exit 1; }

          # Pull latest changes for k8s-configs
          git fetch origin main
          git reset --hard origin/main

          # Update Kubernetes deployment for react-web
          if [ -f "applications/react-web/deployment.yaml" ]; then
            kubectl apply -f applications/react-web/deployment.yaml --namespace=default
            kubectl rollout status deployment/react-web --namespace=default --timeout=5m
          fi

          # Verify deployment
          kubectl get pods -l app=react-web --namespace=default
          kubectl get svc -l app=react-web --namespace=default

          echo "✅ Deployment completed successfully for react-web!"'

      - name: Health check
        run: |
          sleep 10
          response=$(curl -s -o /dev/null -w "%{http_code}" https://inspecciono.com || echo "000")
          if [ "$response" != "200" ]; then
            echo "ℹ️  El deployment se completó, pero el health check falló."
            exit 0
          fi
          echo "✅ Health check passed"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
