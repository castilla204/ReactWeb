name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "k8s/deployment.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "k8s/deployment.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Concurrency control - Best Practice 2025: Evita ejecuciones duplicadas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: erizo9/reactweb

jobs:
  # Job de CI: Build, test y lint
  ci:
    # NO ejecutar en PRs de renovate/dependabot para ahorrar costos
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'renovate[bot]' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
       !startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Regenerar package-lock.json si está desincronizado con package.json
          npm install --package-lock-only
          # Verificar que estén sincronizados
          npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests (if available)
        run: npm test --if-present || echo "No tests configured"

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Job de Security scanning (obligatorio - ANTES de build)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # NO ejecutar en PRs de renovate/dependabot para ahorrar costos
    if: |
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login != 'renovate[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/'))) &&
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    needs: ci

    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scanners: 'vuln,secret,config'
          ignore-unfixed: false
          cache-dir: /tmp/.cache/trivy

      - name: Run Trivy vulnerability scanner (SARIF format)
        id: trivy-sarif
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always() && steps.trivy-sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          wait-for-processing: false
