apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-web-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app.kubernetes.io/instance: react-web
spec:
  ingressClassName: nginx
  rules:
  - host: inspecciono.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-web-svc
            port:
              number: 443
  - host: www.inspecciono.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-web-svc
            port:
              number: 443
  tls:
  - hosts:
    - inspecciono.com
    - www.inspecciono.com
    secretName: inspecciono-tls
