apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-web-ingress
  namespace: default
  labels:
    app: react-web
    managed-by: argocd
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    # Security Headers - Prevenir iframes y otras vulnerabilidades
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/x-frame-options: "DENY"
    nginx.ingress.kubernetes.io/x-content-type-options: "nosniff"
    nginx.ingress.kubernetes.io/x-xss-protection: "1; mode=block"
    nginx.ingress.kubernetes.io/referrer-policy: "strict-origin-when-cross-origin"
    nginx.ingress.kubernetes.io/permissions-policy: "geolocation=(), microphone=(), camera=()"
    nginx.ingress.kubernetes.io/content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.googleapis.com https://js.stripe.com https://static.elfsight.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.atrapo.io https://accounts.google.com https://api.stripe.com https://checkout.stripe.com https://*.elfsight.com; frame-src 'self' https://accounts.google.com https://js.stripe.com https://hooks.stripe.com https://*.elfsight.com; frame-ancestors 'none';"
spec:
  ingressClassName: nginx
  rules:
  - host: inspecciono.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-web-svc
            port:
              number: 80
  - host: www.inspecciono.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-web-svc
            port:
              number: 80
  tls:
  - hosts:
    - inspecciono.com
    - www.inspecciono.com
    secretName: inspecciono-tls
