apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atrapo-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: api.atrapo.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: new-api-svc
            port:
              number: 80
  - host: www.atrapo.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-web-svc
            port:
              number: 80
  tls:
  - hosts:
    - api.atrapo.io
    - www.atrapo.io
    secretName: atrapo-tls
