apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-web
  template:
    metadata:
      labels:
        app: react-web
    spec:
      containers:
      - name: react-web
        image: erizo9/reactweb:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        - containerPort: 443
        env:
        - name: NODE_ENV
          value: "production"
        volumeMounts:
        - name: ssl-certs
          mountPath: "/etc/nginx/certs"
          readOnly: true
      volumes:
      - name: ssl-certs
        secret:
          secretName: react-web-ssl
          items:
          - key: tls.crt
            path: origin-cert.pem
          - key: tls.key
            path: origin-key.key
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: react-web-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: react-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
