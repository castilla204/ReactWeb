apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-web
  template:
    metadata:
      labels:
        app: react-web
    spec:
      containers:
      - name: react-web
        image: erizo9/reactweb:4cf080597535ac7b3be46283077e3778c06f0362  # El workflow lo actualizará
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://new-api-svc"  # Corrige esto para usar el servicio interno
        - name: NODE_ENV
          value: "production"

---
apiVersion: v1
kind: Service
metadata:
  name: react-web-svc
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: react-web
  type: NodePort

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: react-web-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: react-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
