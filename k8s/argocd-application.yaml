apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/castilla204/reactweb.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      exclude: ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=false
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - jsonPointers:
    - /spec/securityContext
    - /spec/containers/*/securityContext
    - /spec/containers/*/resources
    kind: Pod
  - group: networking.k8s.io
    kind: Ingress
    name: react-web-ingress
