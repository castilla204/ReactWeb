apiVersion: v1
kind: Service
metadata:
  name: react-web-svc
  namespace: default
  labels:
    app: react-web
    managed-by: argocd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    app: react-web
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: react-web-metrics
  namespace: default
  labels:
    app: react-web
spec:
  selector:
    matchLabels:
      app: react-web
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

