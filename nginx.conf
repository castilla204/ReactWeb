server {
    listen 80;
    server_name inspecciono.com www.inspecciono.com;
    
    # Security Headers - CSP updated - Prevenir iframes y otras vulnerabilidades
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.googleapis.com https://js.stripe.com https://static.elfsight.com https://universe-static.elfsightcdn.com https://*.elfsightcdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://newapi-yn9v.onrender.com https://api.atrapo.io https://accounts.google.com https://api.stripe.com https://checkout.stripe.com https://*.elfsight.com https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com wss://rveqsehzlvbttlpmsbmi.supabase.co https://rveqsehzlvbttlpmsbmi.supabase.co; frame-src 'self' https://accounts.google.com https://js.stripe.com https://hooks.stripe.com https://*.elfsight.com https://newapi-yn9v.onrender.com; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Ocultar información del servidor
    server_tokens off;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    location /api/ {
        # Best Practice 2025: Resolución dinámica de DNS para Kubernetes
        # Usa el nameserver del pod (10.43.0.10 en K3s) o el servicio DNS del cluster
        resolver 10.43.0.10 valid=10s;
        resolver_timeout 5s;
        set $backend "http://new-api-svc.default.svc.cluster.local:80";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
